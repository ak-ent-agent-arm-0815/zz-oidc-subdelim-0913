name: subprobe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: "a:b"
    steps:
      - name: mint id-token and print ONLY claim fields
        run: |
          set -euo pipefail
          TOK="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=zzprobe0913" \
                 | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')"
          python3 - "$TOK" <<'PYEOF'
          import sys, base64, json
          p = sys.argv[1].split('.')[1]; p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("=== SELECTED CLAIMS ONLY (token never printed) ===")
          for k in ("sub", "environment", "repository",
                    "repo_property_hd_subdelim_0913", "aud", "iss"):
              print("%-34s %r" % (k, c.get(k, "<ABSENT>")))
          print("=== ALL CLAIM KEYS ===")
          print(sorted(c.keys()))
          PYEOF
